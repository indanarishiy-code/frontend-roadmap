<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
	</head>
	<body>
		<!-- form attributes -->
		<!-- action: where to send data | method: get (querystring) or post (body) -->
		<!-- enctype: multipart/form-data required for file uploads -->
		<!-- novalidate: skip built-in validation | autocomplete: browser autofill -->
		<form
			action="/submit"
			method="post"
			enctype="multipart/form-data"
			novalidate
			autocomplete="on"
		>
			<!-- label + for links text to a control by its id (click label = focus input) -->
			<label for="email">Email</label>
			<input type="email" id="email" name="email" />

			<!-- wrapping label needs no for -->
			<label>
				Username
				<input type="text" name="username" />
			</label>

			<!-- fieldset groups related controls, legend names the group -->
			<fieldset>
				<legend>Shipping Address</legend>
				<label for="street">Street</label>
				<input type="text" id="street" name="street" />
				<label for="city">City</label>
				<input type="text" id="city" name="city" />
			</fieldset>

			<!-- disabled fieldset disables every control inside it -->
			<fieldset disabled>
				<legend>Billing (same as shipping)</legend>
				<label for="bill-street">Street</label>
				<input type="text" id="bill-street" name="billStreet" />
			</fieldset>

			<!-- text inputs with common attributes -->
			<input
				type="text"
				name="fullName"
				placeholder="Jane Doe"
				required
				minlength="2"
				maxlength="60"
				autocomplete="name"
			/>
			<input type="email" name="workEmail" multiple placeholder="a@x.com, b@y.com" />
			<input
				type="password"
				name="password"
				required
				minlength="8"
				autocomplete="new-password"
			/>
			<input type="search" name="q" />
			<input type="tel" name="phone" pattern="[0-9]{10}" />
			<input type="url" name="site" />

			<!-- numeric / range -->
			<input type="number" name="qty" min="1" max="10" step="1" value="1" />
			<input type="range" name="volume" min="0" max="100" step="5" value="50" />

			<!-- date & time family -->
			<input type="date" name="dob" />
			<input type="time" name="slot" />
			<input type="datetime-local" name="startsAt" />
			<input type="month" name="expMonth" />
			<input type="week" name="week" />

			<!-- color -->
			<input type="color" name="theme" value="#3366ff" />

			<!-- file upload -->
			<input type="file" name="avatar" accept="image/*" />
			<input type="file" name="docs" accept=".pdf,.doc" multiple />

			<!-- checkbox: single opt-in -->
			<label>
				<input type="checkbox" name="subscribe" value="yes" checked />
				Subscribe to newsletter
			</label>

			<!-- checkbox group: same name, array of values -->
			<fieldset>
				<legend>Interests</legend>
				<label><input type="checkbox" name="tags" value="js" /> JS</label>
				<label><input type="checkbox" name="tags" value="css" /> CSS</label>
				<label><input type="checkbox" name="tags" value="html" /> HTML</label>
			</fieldset>

			<!-- radio group: same name = mutually exclusive -->
			<fieldset>
				<legend>Plan</legend>
				<label><input type="radio" name="plan" value="basic" required /> Basic</label>
				<label><input type="radio" name="plan" value="pro" /> Pro</label>
			</fieldset>

			<!-- select: dropdown, optgroup groups options -->
			<label for="country">Country</label>
			<select id="country" name="country">
				<option value="">-- choose --</option>
				<optgroup label="Asia">
					<option value="id">Indonesia</option>
					<option value="jp">Japan</option>
				</optgroup>
				<optgroup label="Europe">
					<option value="de">Germany</option>
				</optgroup>
			</select>

			<!-- multi-select -->
			<select name="langs" multiple size="3">
				<option value="en">English</option>
				<option value="fr">French</option>
				<option value="es">Spanish</option>
			</select>

			<!-- datalist: free text input with suggestions -->
			<label for="browser">Browser</label>
			<input type="text" id="browser" name="browser" list="browsers" />
			<datalist id="browsers">
				<option value="Chrome"></option>
				<option value="Firefox"></option>
				<option value="Safari"></option>
			</datalist>

			<!-- textarea: multi-line text -->
			<label for="bio">Bio</label>
			<textarea id="bio" name="bio" rows="4" cols="40" maxlength="500"></textarea>

			<!-- hidden: submitted but not shown -->
			<input type="hidden" name="formVersion" value="2" />

			<!-- output: display a computed result -->
			<output name="result" for="qty volume">75</output>

			<!-- progress & meter (not form controls, but form-related) -->
			<progress value="30" max="100">30%</progress>
			<meter value="0.6" min="0" max="1">60%</meter>

			<!-- buttons: submit / reset / generic -->
			<button type="submit">Submit</button>
			<button type="reset">Reset</button>
			<button type="button">Do something (JS)</button>

			<!-- input-style buttons -->
			<input type="submit" value="Send" />
			<input type="image" src="https://picsum.photos/80/30" alt="Submit" />

			<!-- override form attrs from a specific submit button -->
			<button type="submit" formaction="/draft" formmethod="post" formnovalidate>
				Save draft
			</button>
		</form>

		<!-- control outside the form, linked back via form="" attribute -->
		<input type="text" name="promo" form="promoForm" />
		<form id="promoForm" action="/promo" method="post"></form>
	</body>
</html>
